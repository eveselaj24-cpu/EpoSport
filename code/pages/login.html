<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | UniSport</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body class="login-page">
    <header class="navbar">
        <a class="logo" href="../index.html">Uni<span>Sport</span></a>
        <a class="login-home" href="../index.html">Back to home</a>
    </header>

    <main class="login-main">
        <section class="login-card" aria-labelledby="login-title">
            <h1 id="login-title">Log in</h1>
            <p>Use your university email to sign in to UniSport.</p>

            <form class="login-form" method="post">
                <div class="login-field">
                    <label for="email">University email</label>
                    <input type="email" id="email" autocomplete="username" required>
                </div>

                <div class="login-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" autocomplete="current-password" required>
                </div>
                <div class="login-field">
    <label for="role">Log in as</label>

    <select id="role" required>
        <option value="">Select your role</option>
        <option value="student">Student</option>
        <option value="admin">Admin</option>
    </select>
</div>
                <button type="submit" class="btn-primary">Log in</button>
                <p class="login-feedback" role="status"></p>
            </form>
        </section>
    </main>
    <script src="../js/student.js"></script>
    <script>
        

const loginForm = document.querySelector(".login-form");
const loginFeedback = document.querySelector(".login-feedback");

loginForm.addEventListener("submit", function(event) {
    event.preventDefault();

    // Get values from the form
    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;
    const role = document.getElementById("role").value;

    // Reset feedback
    loginFeedback.textContent = "";
    loginFeedback.style.color = "#f87171";

    // Check empty fields
    if (email === "" || password === "" || role === "") {
        loginFeedback.textContent = "Please fill in all fields.";
        return;
    }

    // Check email format
    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (!emailPattern.test(email)) {
        loginFeedback.textContent = "Please enter a valid email address.";
        return;
    }

    // Check if account exists
    const user = users.find(function(account) {
        return account.email.toLowerCase() === email &&
               account.password === password &&
               account.role === role;
    });

    if (!user) {
        loginFeedback.textContent =
            "Incorrect email, password, or selected role.";
        return;
    }

    // Successful demo login
    loginFeedback.style.color = "#86efac";
    loginFeedback.textContent = "Login successful! Redirecting...";

    setTimeout(function() {
        if (user.role === "student") {
            window.location.href = "student-dashboard.html";
        } else if (user.role === "admin") {
            window.location.href = "admin-dashboard.html";
        }
    }, 1000);
});


    </script>

</body>
</html>
